# ============================================================
# CI: build all 7 projects, run all test suites, prove the source tree stays clean
#
# The steps that actually do the work live in tools/ci.ps1.
# The steps that provision the machine live in tools/ci-deps.ps1.
#
# Why a script and not a pile of YAML:
#   a CI that only exists inside YAML is a CI nobody can run before
#   pushing -- so its first real execution is also its first
#   debugging session. tools/ci.ps1 runs the same steps locally.
#
# ⚠ Same argument for the provisioning steps. They used to live here
#   as inline YAML, which meant they were the one part of this file
#   that had NEVER been executed. tools/ci-deps.ps1 is now the only
#   copy, and the local rehearsal runs that same file.
#
# What the job guarantees:
#   · 7 projects compile (Release)
#   · 31 ctest suites pass (W1 1 + W2 1 + W6 3 + W7 26)
#   · W5's executable still decodes a QR
#   · every number quoted in the docs matches the build
#   · every relative link in the docs resolves
#   · every section pointer in the docs resolves
#   · the census gate's own failure path still catches a broken ruler
#     (four mutations, run on every CI run, against copies of the tree)
#   · the source tree is byte-identical after all of that
#     (test products must land in build/, never in the source tree)
#
# ✅ VERIFIED END TO END on a GitHub runner (2026-10-26, run 40315236950).
#   The whole job ran on windows-2022 and came back green: 7 projects
#   built, 29 ctest suites / 2853 assertions passed, W5 smoke ok, W7
#   headless pipeline ok, source tree byte-identical afterwards.
#
#   The provisioning step -- choco installing tesseract, aqtinstall
#   fetching Qt 6.8.3, the official OpenCV *world* package -- ran on
#   the real runner image for the first time and worked.
#
#   That first real run also dug up four things that were invisible
#   locally: an empty dir is not in git / Qt's DLLs are not on PATH /
#   tesseract's PATH was only in the YAML / and the ACP made the very
#   same code two different things on two machines. See
#   notes/notes_CI_FirstRunnerRun_2026-10.md, and chapter 10 of
#   notes/notes_CI_2026-10.md.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (windows)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Dependencies: Tesseract / Qt 6.8.3 / OpenCV 4.13.0
      #
      # tools/ci-deps.ps1 is the ONLY copy of these commands, and it
      # is the same file the local rehearsal runs.  What we verify
      # locally is literally what runs here.
      #
      # The three traps it was written to survive (all three were real
      # bugs in the previous inline version -- see
      # notes/notes_CI_2026-10.md):
      #
      #   1. aqt's architecture argument is win64_msvc2022_64.
      #      'msvc2022_64' is NOT an alias: aqt dies with
      #      "The packages ['qt_base'] were not found".
      #
      #   2. The official OpenCV Windows package is a *world* build:
      #      opencv_world4130.lib / .dll, and NO opencv_core4130.*.
      #      A lookup that names a module finds nothing and the job
      #      dies with "no opencv_core*.dll found".
      #
      #   3. The import lib and OpenCVConfig.cmake sit in the SAME
      #      directory (…/x64/vc16/lib).  A lookup that expects a
      #      <cfg>/lib/ subdirectory finds nothing.
      #
      # The script asserts the paths it reports really hold the files
      # it claims -- a path we report but that is empty is a lie the
      # build would only find much later, with a much worse message.
      # ------------------------------------------------------------
      - name: Provision dependencies
        shell: pwsh
        run: |
          ./tools/ci-deps.ps1

      # ------------------------------------------------------------
      # The actual CI
      # ------------------------------------------------------------
      - name: Run CI
        shell: pwsh
        run: |
          # NOTE: the PATH for tesseract and for Qt's DLLs is set INSIDE
          # tools/ci.ps1, not here. It used to be here -- and that was
          # the second copy of the same fact, which meant the local
          # rehearsal did not do what the runner did. One place now.
          ./tools/ci.ps1 `
            -OpenCvLib $env:OPENCV_LIB `
            -OpenCvBin $env:OPENCV_BIN `
            -QtRoot    $env:QT_ROOT
